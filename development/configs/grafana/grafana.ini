[feature_toggles]
enable = nestedFolders,correlations,vizAndWidgetSplit

[dashboards]
# Set to the uid of the dashboard you want as the home dashboard
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/Nautobot.json

[auth.anonymous]
enabled = true
org_name = Main Org.
# Editor (not Viewer) so anonymous local-dev users can open Explore for ad-hoc trace/log
# queries; Viewer cannot access Explore. Dev-only stack - not for production.
org_role = Editor
