---
apiVersion: 1
providers:
  - name: "Nautobot"
    orgId: 1
    type: "file"
    disableDeletion: false
    updateIntervalSeconds: 10
    # Allow editing in the UI; note that edits are overwritten from the JSON on restart
    allowUiUpdates: true
    options:
      path: "/etc/grafana/provisioning/dashboards"
