{% load static %}
<ul
    class="h-100 list-unstyled position-relative nb-draggable-container nb-sidenav-favorites-container"
    hx-post="{% url "user:navbar_favorites_reorder" %}"
    hx-swap="none"{# Just saving the new element order here, so it is OK to skip the HTMX swap. #}
    hx-trigger="nb-sidenav-favorites:reorder"{# Custom event fired by `sidenav.js` script. #}
    hx-vals="javascript:{ordered_links:event.detail.ordered_links}"
>
    {% for item in request.user.navbar_favorites %}
        {% if item.link and item.name %}
            <li class="nb-sidenav-link-wrapper nb-draggable" id="sidenav-favorite-link-{{ forloop.counter }}">
                <span class="nb-draggable-handle nb-sidenav-favorite-drag-handle">
                    <span class="mdi mdi-drag-vertical"></span>
                </span>
                <a class="nb-sidenav-link flat vstack align-items-start" draggable="false" href="{{ item.link }}">
                    {{ item.name }}
                    <small class="text-secondary text-truncate">{{ item.tab_name }}</small>
                </a>
                <button class="nb-sidenav-favorite active"
                        type="button"
                        hx-post="{% url "user:navbar_favorites_delete" %}"
                        hx-vals='{"link": "{{ item.link }}", "name": "{{ item.name }}", "tab_name": "{{ item.tab_name }}", "group_name": "{{ item.group_name }}", "remove": true}'
                        hx-target="#sidenav-favorite-link-{{ forloop.counter }}"
                        hx-swap="delete"
                >
                    <span class="visually-hidden">
                        Remove from favorites
                    </span>
                </button>
            </li>
        {% endif %}
    {% empty %}
        <li class="nb-sidenav-link-group text-center" style="text-transform: none;">
            You don't have any favorite pages yet.
        </li>
    {% endfor %}
</ul>
