{% load render_table from django_tables2 %}

{% if table %}
    <div class="nb-live-search-results" data-nb-results-type="live-search">
        {% render_table table table_inc_template|default:'inc/table.html' %}
        {% if table.page.has_next %}
            <ul class="nb-search-list-group">
                <li>
                    <a class="nb-search-list-group-item text-secondary" href="{{ href }}">
                        More...
                    </a>
                </li>
            </ul>
        {% endif %}
    </div>
{% endif %}
