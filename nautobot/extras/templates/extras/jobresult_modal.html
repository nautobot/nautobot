{% load helpers %}
{% include 'inc/modal_header.html' with title=title %}

{# Apps extending this template may add <style> tags and/or component includes here #}
{% block jobresult_extra_styles %}{% endblock jobresult_extra_styles %}

<div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
    {# Apps extending this template may add content above the standard job result rows here #}
    {% block jobresult_body_prepend %}{% endblock jobresult_body_prepend %}
    {# Polling Logic: Only present if the job is not finished. Intentionally not overridable by Apps. #}
    <div id="job-polling-container"
         {% if refresh_on_close_if_done == "true" and not job_is_pending %}data-nb-refresh-on-close="true"{% endif %}
         {% if job_is_pending %}
             hx-post="{% url 'extras:jobresult_modal' pk=result.pk %}"
             hx-trigger="every 2s"
             hx-target="#modal-content-container"
             hx-swap="innerHTML"
             hx-vals='{"title": "{{ title }}", "job_result_key": "{{ job_result_key }}", "refresh_on_close_if_done": "{{ refresh_on_close_if_done }}", "job_modal_button": "{{ job_modal_button }}"}'
         {% endif %}>
        <div class="container-fluid gy-3">
            {# Override an individual row below to replace it, or this block (with `{{ block.super }}`) to add rows. #}
            {# Each row is responsible for rendering both the pending and the finished state of the job. #}
            {% block jobresult_rows %}
                {% block jobresult_status %}
                    <div class="row align-items-center" style="margin-bottom: 12px;">
                        <div class="col-4 text-end fw-semibold">Job Status:</div>
                        <div class="col-8">
                            {% include 'extras/inc/job_label.html' with result=result %}
                        </div>
                    </div>
                {% endblock jobresult_status %}
                {% block jobresult_duration %}
                    <div class="row align-items-center" style="margin-bottom: 12px;">
                        <div class="col-4 text-end fw-semibold">Duration:</div>
                        <div class="col-8">
                            {% if job_is_pending %}
                                <div class="d-flex align-items-center">
                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                </div>
                            {% else %}
                                <span>{{ result.duration }}</span>
                            {% endif %}
                        </div>
                    </div>
                {% endblock jobresult_duration %}
                {% block jobresult_detail %}
                    <div class="row align-items-center" style="margin-bottom: 12px;">
                        <div class="col-4 text-end fw-semibold">Details</div>
                        <div class="col-8">
                            {% if job_is_pending %}
                                <div class="d-flex align-items-center">
                                    <span class="text-secondary">Job is running, please wait...</span>
                                </div>
                            {% else %}
                                <pre class="form-control bg-body-tertiary" style="min-height: 44px;"><!--
                                    --><code>{{ detail_value }}</code>
                                </pre>
                            {% endif %}
                        </div>
                    </div>
                {% endblock jobresult_detail %}
            {% endblock jobresult_rows %}
        </div>
    </div>
</div>

<div class="modal-footer">
    {% block jobresult_footer %}
        {% if not job_is_pending and redirect_button %}
            <a href="{{ redirect_button.url }}" class="btn btn-{{ redirect_button.color }}"
               {% for key, value in redirect_button.attributes.items %}{{ key }}="{{ value }}" {% endfor %}><!--
                -->{{ redirect_button.label}}
            </a>
        {% endif %}
        <a href="{{ result.get_absolute_url }}" class="btn btn-primary"><!--
            -->View Job Results
        </a>
        <button type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
        >
            <span aria-hidden="true" class="mdi mdi-close me-4"></span><!--
            -->Close
        </button>
    {% endblock jobresult_footer %}
</div>
