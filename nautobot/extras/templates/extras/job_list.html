{% extends 'generic/object_list.html' %}
{% load helpers %}

{% block extra_styles %}
    <style>
        tr a.job_run {
            display: inline-flex;
            gap: 0.625rem; /* 10px */
        }

        tr a.job_run .btn {
            align-self: flex-start;
            margin-block: -0.09375rem; /* -1.5px */
        }

        tr :last-child {
            margin-bottom: 0;
        }

        tr.disabled td {
            color: var(--bs-secondary-color);
        }

        /*
         * A row is marked `disabled` in `inc/job_table.html` when the job cannot be run. That used to be dimmed with
         * `opacity: 0.65` over the whole link, which composited the link text down to 2.81:1 against the page and the
         * play button to the same -- failing both 1.4.3 (4.5:1 for text) and 1.4.11 (3:1 for a user interface
         * component) on every disabled row. There are usually far more disabled rows than enabled ones.
         *
         * Opacity cannot express this state conformantly: the link text only clears 4.5:1 above 0.92 opacity, which is
         * not a perceptible change. Mute with the token the row's other cells already use instead, measured at 6.76:1
         * in light mode and 8.49:1 in dark.
         */
        tr.disabled a.job_run {
            color: var(--bs-secondary-color);
            cursor: not-allowed;
        }

        tr.disabled a.job_run .btn {
            background-color: var(--bs-secondary-color);
            border-color: var(--bs-secondary-color);
            color: var(--bs-body-bg);
            cursor: inherit;
        }

        tr.disabled p {
            color: inherit;
        }
    </style>
{% endblock %}

{% block buttons %}
    <div class="btn-group" role="group">
        <a href="{% django_querystring display='list' %}"
           class="btn btn-primary{% if display == 'list' %} bg-primary nb-text-body-bg{% endif %}">
            <span class="mdi mdi-view-sequential" aria-hidden="true"></span> List
        </a>
        {# djlint:off B123 #}
        <a href="{% django_querystring display='tiles' %}"
           class="btn btn-primary{% if display == 'tiles' %} bg-primary nb-text-body-bg{% endif %}">
            <span class="mdi mdi-view-grid" aria-hidden="true"></span> Tiles
        </a>
        {# djlint:on B123 #}
    </div>

    <button
        aria-expanded="true"
        class="btn btn-secondary"
        data-nb-toggle="collapse-all"
        data-nb-target="#job_accordion .collapse"
        type="button"
        {% if display == "tiles" %}disabled{% endif %}
    >
        Collapse All Groups
    </button>
{% endblock %}
