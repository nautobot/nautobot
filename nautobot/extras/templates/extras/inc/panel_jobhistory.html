{% comment %}
Every direct child here is an `<li>`, including the empty-state and no-permission branches, because this panel renders
straight into the home page's `<ul class="list-group">`. A `<ul>` may only contain `<li>` (plus `<script>`/`<template>`),
and browsers and assistive technology stop reporting it as a list otherwise.
{% endcomment %}
{% if job_results and perms.extras.view_jobresult %}
    {% for result in job_results %}
        <li class="list-group-item">
            {% comment %}
            `job_model` is nullable -- a JobResult outlives the Job record it came from -- and without a fallback the link
            renders with no text at all, leaving a link with no accessible name.
            {% endcomment %}
            <a href="{% url 'extras:jobresult' pk=result.pk %}">
                {% firstof result.job_model.name result.name "Unknown job" %}
            </a>
            <span class="float-end" data-bs-toggle="tooltip" data-bs-title="{{ result.date_created }}" data-bs-fallback-placements="[&quot;top&quot;]">
                {% include 'extras/inc/job_label.html' %}
            </span>
            <br>
            <small>
                <span class="text-secondary">{{ result.user }} - {{ result.date_done|date:"SHORT_DATETIME_FORMAT" }}</span>
            </small>
        </li>
        {% if forloop.last %}
            <li class="list-group-item text-end">
                <a href="{% url 'extras:jobresult_list' %}">View All History</a>
            </li>
        {% endif %}
    {% endfor %}
{% elif perms.extras.view_jobresult %}
    <li class="card-body text-secondary">
        None found
    </li>
{% else %}
    <li class="card-body text-secondary">
        <span class="mdi mdi-lock" aria-hidden="true"></span> No permission
    </li>
{% endif %}
