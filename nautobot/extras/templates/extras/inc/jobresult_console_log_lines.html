{% load time_formats %}
{% spaceless %}
    {% for entry in entries %}
        <span
            class="console-line console-{{ entry.output_type }} d-block"
            data-timestamp="{{ entry.timestamp.isoformat }}"
        >
            <span>[{{ entry.timestamp|preferred_time_milliseconds }}]</span>
            <span> {{ entry.text }}</span>
        </span>
    {% endfor %}
{% endspaceless %}
